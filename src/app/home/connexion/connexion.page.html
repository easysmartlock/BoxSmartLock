<ion-header>
  <ion-toolbar>
    <div class="ion-text-center">
      <img class="logo" src="/assets/images/logo.png" />
    </div>
    <ion-buttons slot="end">
      <ion-back-button [text]="'Retour'"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-progress-bar *ngIf="loading == true" type="indeterminate"></ion-progress-bar>
  <ion-backdrop *ngIf="loading == true" tappable="false"></ion-backdrop>
  <div class="ion-padding-horizontal" id="container">
    <h4 class="mb-3 mt-3">
      Connexion
    </h4>
    <form>
      <ion-item>
        <ion-label position="stacked">
          Email
        </ion-label>
        <ion-input [(ngModel)]="email" name="email" type="email"></ion-input>
      </ion-item> 
      <ion-item>
        <ion-label position="stacked">
          Mot de passe
        </ion-label>
        <ion-input type="password" [(ngModel)]="password" name="password"></ion-input>
      </ion-item>   
      <div class="mt-5">
        <ion-button (click)="do()" expand="block" color="primary">
          Valider
        </ion-button>
      </div>   
    </form>
    <p class="mt-3 text-center">
      <a color="default" [routerLink]="['/home/pass']">
        Mot de passe oublié
      </a>
    </p>
    <p class="mt-5 text-center">
      Vous n'avez pas de compte ?
      <a [routerLink]="['/home/inscription']">Inscription</a>
    </p>
    <p class="mt-5">
      <app-version></app-version> 
    </p>
  </div>
</ion-content>
